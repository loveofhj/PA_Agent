<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WP8 PA Agent</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header><div><strong>WP8 PA Agent</strong><span>LT2 FRT 도어트림 · 정밀조립</span></div><button id="health">LLM 상태 점검</button></header>
<nav aria-label="운영 메뉴">
<button data-page="overview" aria-current="page">대시보드</button><button data-page="task">작업·인터록</button><button data-page="skills">Skill Registry</button><button data-page="episodes">Episode·품질</button><button data-page="catalog">데이터셋</button><button data-page="events">이벤트 로그</button>
</nav>
<main>
<p id="status" role="status"></p>
<section id="overview"><div id="metrics" class="metrics"></div><h2>최근 작업</h2><div id="recent"></div><h2>최근 이벤트·알람</h2><div id="alarms"></div></section>
<section id="task" hidden>
<h1>작업 계획 및 실행</h1>
<form id="plan"><label>작업지시<textarea name="instruction" required>LT2 FRT 도어트림 LH 1개 조립</textarea></label><div class="row"><label>지그 ID<input name="JigID" required value="JIG-DEMO"></label><label>툴 ID<input name="ToolID" required value="TOOL-DEMO"></label></div><button>계획 미리보기</button></form>
<div id="task-result"></div>
<form id="run" hidden><label>Mock 실행 시나리오<select name="scenario">
<option value="normal">정상</option><option value="mismatch">지그 불일치</option><option value="recover">체결 실패 후 복구</option><option value="failure">체결 재작업 한도 초과</option><option value="ng">최종 검사 NG</option><option value="safe_stop">안전 허가 없음</option><option value="stale">PLC 상태 STALE</option><option value="low_confidence">저신뢰</option><option value="timeout">응답 타임아웃</option>
</select></label><button>Mock 실행 승인</button></form>
<div id="task-events"></div>
</section>
<section id="skills" hidden><h1>Skill Registry</h1><div id="skill-list"></div></section>
<section id="episodes" hidden>
<h1>Episode 수집 및 품질 검사</h1>
<form id="collect">
<div class="row"><label>수집 모드<select name="mode"><option value="mock">Mock 생성</option><option value="upload">파일 업로드</option></select></label><label>출처<select name="source"><option>Sim</option><option>Real</option></select></label><label>STEP<select name="step_code" id="episode-step"></select></label><label>Skill<select name="skill_id" id="episode-skill"></select></label></div>
<div class="row"><label>최종 검사<select name="final_inspection"><option>OK</option><option>NG</option></select></label><label>계열<select name="series"><option value="normal">정상</option><option value="variation">변동</option><option value="recovery">복구</option></select></label><label>복구 이력<input name="recovery"></label><label class="check"><input name="label_confirmed" type="checkbox" checked>라벨 확인</label></div>
<details><summary>ID·레시피·버전 입력</summary><div id="metadata" class="row"></div></details>
<div class="row" id="upload-fields" hidden><label>센서 레코드<input type="file" name="file" accept=".csv,.json,.jsonl"></label><label>로컬 MP4 원본<input type="file" name="video" accept=".mp4"></label></div>
<button>수집 및 검사</button></form><div id="episode-result"></div><h2>수집된 에피소드</h2><div id="episode-list"></div>
</section>
<section id="catalog" hidden>
<h1>AI Ready 데이터셋</h1>
<form id="promote"><div class="row"><label>데이터셋 ID<input name="dataset_id" required value="wp8-demo"></label><label>소유 기관<input name="owner" value="local"></label><label>접근 권한<input name="access" value="local"></label><label>보안 등급<input name="classification" value="internal"></label><label>보관 기간<input name="retention" value="TBD"></label></div><div id="members"></div><button>선택한 에피소드로 새 버전 등록</button></form>
<h2>카탈로그</h2><form id="filters" class="row"><label>STEP<input name="step" placeholder="S7"></label><label>Skill<input name="skill" placeholder="SKL-011"></label><label>출처<select name="source"><option value="">전체</option><option>Real</option><option>Sim</option><option>Co-training</option></select></label><label>품질<select name="grade"><option value="">전체</option><option>A</option><option>B</option><option>C</option></select></label><button>조회</button></form><div id="datasets"></div>
</section>
<section id="events" hidden><h1>이벤트·결정 로그</h1><button id="replay">로컬 Outbox 재전송</button><div id="event-list"></div></section>
</main>
</body>
</html>
